openapi: 3.0.3
info:
  title: LedgerLine API
  version: 0.4.0
  description: >-
    Authenticated, PostgreSQL-backed financial ledger prototype. Customer-account
    movements are simulated against internal clearing accounts; external payment rails are not connected.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': { description: API and database health }
  /api/v1/status:
    get:
      security: []
      responses:
        '200': { description: Service metadata }
  /api/v1/validation/amount:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Amount' }
      responses:
        '200': { description: Canonical positive paise string }
        '400': { description: Invalid amount }
  /api/v1/auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201': { description: Account-holder registration and session }
        '400': { description: Invalid credentials }
        '409': { description: Email already registered }
  /api/v1/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200': { description: Authenticated user and access token }
        '401': { description: Invalid credentials }
        '429': { description: Login rate limited }
  /api/v1/auth/logout:
    post:
      responses:
        '204': { description: Current database-backed session revoked }
        '401': { description: Authentication required }
  /api/v1/auth/me:
    get:
      responses:
        '200': { description: Current user and database-loaded roles }
        '401': { description: Authentication required }
  /api/v1/accounts:
    get:
      description: Returns accounts visible to the holder by ownership/view permission, or all accounts for Admin/Auditor.
      responses:
        '200': { description: Authorized account list }
        '401': { description: Authentication required }
    post:
      description: Creates an INR account for the authenticated user or, for Admin, the specified user. Current schema permits one customer account per owner and currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, currency]
              properties:
                userId: { type: string, format: uuid }
                currency: { type: string, enum: [INR] }
      responses:
        '201': { description: Account created }
        '403': { description: User is not authorized to create for the specified owner }
        '409': { description: Owner already has an account in this currency }
  /api/v1/accounts/{accountId}:
    get:
      parameters: [{ $ref: '#/components/parameters/accountId' }]
      description: Owner/view-permission access; Admin/Auditor have read access.
      responses:
        '200': { description: Account and persisted balance snapshot }
        '403': { description: Account access denied }
        '404': { description: Account not found }
  /api/v1/accounts/{accountId}/transfer-destinations:
    get:
      parameters: [{ $ref: '#/components/parameters/accountId' }]
      description: Requires source ownership, Admin, or explicit transfer permission. Returns all eligible active INR customer accounts with a generic display name and masked identifier; this is not a private payee directory.
      responses:
        '200': { description: Minimal eligible recipient fields }
        '403': { description: Source transfer access denied }
  /api/v1/accounts/{accountId}/transactions:
    get:
      parameters:
        - { $ref: '#/components/parameters/accountId' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      description: Paginated ledger entries and account-associated refused attempts. Attempt rows do not change balances and carry the computed balance at their position in the ordered activity timeline.
      responses:
        '200': { description: Paginated account statement }
        '400': { description: Invalid pagination }
        '403': { description: Account access denied }
  /api/v1/accounts/{accountId}/permissions:
    post:
      x-required-roles: [ADMIN]
      parameters: [{ $ref: '#/components/parameters/accountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, permission]
              properties:
                userId: { type: string, format: uuid }
                permission: { type: string, enum: [view, deposit, withdraw, transfer] }
      responses:
        '204': { description: Permission granted }
        '403': { description: Admin role required }
  /api/v1/accounts/{accountId}/status:
    patch:
      x-required-roles: [ADMIN]
      parameters: [{ $ref: '#/components/parameters/accountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, frozen, closed] }
      responses:
        '204': { description: Account status updated }
        '403': { description: Admin role required }
  /api/v1/accounts/{accountId}/limits:
    put:
      x-required-roles: [ADMIN]
      parameters: [{ $ref: '#/components/parameters/accountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dailyDebitLimitPaise, dailyCreditLimitPaise]
              properties:
                dailyDebitLimitPaise: { type: string, pattern: '^[1-9][0-9]*$' }
                dailyCreditLimitPaise: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '204': { description: Limits updated }
        '403': { description: Admin role required }
  /api/v1/accounts/{accountId}/deposit:
    post:
      parameters:
        - { $ref: '#/components/parameters/accountId' }
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Amount' }
      responses:
        '201': { description: Simulated external deposit posted against the system clearing account }
        '400': { description: Invalid amount or missing idempotency key }
        '422': { description: Refused attempt }
  /api/v1/accounts/{accountId}/withdraw:
    post:
      parameters:
        - { $ref: '#/components/parameters/accountId' }
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Amount' }
      responses:
        '201': { description: Simulated withdrawal posted against the system clearing account }
        '422': { description: Refused attempt, including insufficient funds }
  /api/v1/accounts/{accountId}/transfer:
    post:
      parameters:
        - { $ref: '#/components/parameters/accountId' }
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Transfer' }
      responses:
        '201': { description: Balanced internal transfer posted }
        '202': { description: High-value transfer awaiting Admin approval }
        '409': { description: Idempotency key reused with a different request }
        '422': { description: Refused attempt }
  /api/v1/transactions/{transactionId}:
    get:
      parameters: [{ $ref: '#/components/parameters/transactionId' }]
      description: Initiator, account owner, Admin, or Auditor may read transaction detail.
      responses:
        '200': { description: Transaction, ledger legs, and audit timeline }
        '403': { description: Transaction access denied }
        '404': { description: Transaction not found }
  /api/v1/transactions/{transactionId}/approve:
    post:
      x-required-roles: [ADMIN]
      parameters: [{ $ref: '#/components/parameters/transactionId' }]
      responses:
        '201': { description: Pending transfer approved and posted }
        '403': { description: Admin role required }
        '422': { description: Approval rechecks refused the transfer }
  /api/v1/transactions/{transactionId}/reverse:
    post:
      x-required-roles: [ADMIN]
      parameters:
        - { $ref: '#/components/parameters/transactionId' }
        - { $ref: '#/components/parameters/idempotencyKey' }
      responses:
        '201': { description: Compensating reversal posted }
        '403': { description: Admin role required }
        '409': { description: Transaction is not reversible or key conflicts }
  /api/v1/scheduled-payments:
    get:
      description: Returns schedules owned by the account holder; Admin/Auditor roles can list all schedules.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Paginated scheduled payment list }
    post:
      description: Creates a ONE-TIME future internal INR transfer only. Source must be owned or have delegated transfer permission. High-value schedules are rejected; submit those as immediate transfers for existing Admin approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourceAccountId, destinationAccountId, amountPaise, executeAt, description]
              properties:
                sourceAccountId: { type: string, format: uuid }
                destinationAccountId: { type: string, format: uuid }
                amountPaise: { type: string, pattern: '^[1-9][0-9]*$' }
                executeAt: { type: string, format: date-time }
                description: { type: string, minLength: 1, maxLength: 255 }
                retryLimit: { type: integer, minimum: 0, maximum: 10, default: 3 }
                retryDelayMinutes: { type: integer, minimum: 1, maximum: 1440, default: 60 }
                reminderMinutes: { type: integer, minimum: 0, maximum: 10080, default: 1440 }
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 255 } }
      responses:
        '201': { description: Schedule created; execution requires the separately deployed worker }
        '400': { description: Invalid body, date, or same source/destination }
        '403': { description: Transfer permission denied or Auditor attempted creation }
        '422': { description: Account unavailable or high-value approval required }
        '409': { description: Idempotency key reused for a different schedule payload }
  /api/v1/scheduled-payments/eligible-accounts:
    get:
      description: Returns active INR customer accounts the caller owns or has transfer permission on, using masked identifiers.
      responses:
        '200': { description: Authorized source accounts for scheduled transfers }
        '401': { description: Authentication required }
  /api/v1/scheduled-payments/{scheduleId}:
    get:
      parameters: [{ name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Owned schedule and up to 100 occurrences/attempts }
        '404': { description: Schedule not found or not visible }
  /api/v1/scheduled-payments/{scheduleId}/actions:
    post:
      parameters: [{ name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [pause, resume, cancel] }
      responses:
        '200': { description: Schedule paused, resumed, or cancelled }
        '404': { description: Schedule not found or not visible }
        '409': { description: Current schedule state does not allow this action }
  /api/v1/recurring-payments:
    get:
      description: Lists recurring configurations owned by the account holder; Admin/Auditor roles can list all configurations.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Paginated recurring payment configurations }
    post:
      description: Creates a distinct daily/weekly/monthly internal INR recurring transfer configuration. High-value plans are rejected rather than bypassing Admin approval.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourceAccountId, destinationAccountId, amountPaise, frequency, startAt, description]
              properties:
                sourceAccountId: { type: string, format: uuid }
                destinationAccountId: { type: string, format: uuid }
                amountPaise: { type: string, pattern: '^[1-9][0-9]*$' }
                frequency: { type: string, enum: [daily, weekly, monthly] }
                startAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                description: { type: string, minLength: 1, maxLength: 255 }
                retryLimit: { type: integer, minimum: 0, maximum: 10, default: 3 }
                retryDelayMinutes: { type: integer, minimum: 1, maximum: 1440, default: 60 }
                reminderMinutes: { type: integer, minimum: 0, maximum: 10080, default: 1440 }
      responses:
        '201': { description: Recurring configuration persisted; execution requires the separate worker }
        '403': { description: Source transfer permission denied or Auditor attempted creation }
        '409': { description: Idempotency key reused for a different configuration }
        '422': { description: Account unavailable or high-value approval required }
  /api/v1/recurring-payments/{paymentId}:
    get:
      parameters: [{ name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Recurring configuration with persisted occurrence/attempt history }
        '404': { description: Payment not found or not visible }
  /api/v1/recurring-payments/{paymentId}/actions:
    post:
      parameters: [{ name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties: { action: { type: string, enum: [pause, resume, cancel] } }
      responses:
        '200': { description: Recurring configuration state changed }
        '404': { description: Payment not found or not visible }
        '409': { description: Current state does not allow this action }
  /api/v1/analytics:
    get:
      x-required-roles: [ADMIN, AUDITOR]
      description: Authorized global ledger aggregates, transaction status totals, account balances, balance growth, and latest persisted reconciliation status. Aggregates use real database records only.
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: accountId, in: query, schema: { type: string, format: uuid } }
        - { name: transactionType, in: query, schema: { type: string, enum: [deposit, withdrawal, transfer, reversal] } }
        - { name: status, in: query, schema: { type: string, enum: [posted, reversed, failed, pending] } }
        - { name: granularity, in: query, schema: { type: string, enum: [day, week, month], default: day } }
      responses:
        '200': { description: Filtered KPI, trend, balance-growth, distribution and account-summary data }
        '400': { description: Invalid or oversized date range }
        '403': { description: Admin or Auditor role required }
  /api/v1/admin/reconciliation/run:
    post:
      x-required-roles: [ADMIN]
      responses:
        '201': { description: Persisted point-in-time reconciliation run and findings; ledger history is not changed }
        '403': { description: Admin role required }
  /api/v1/admin/reconciliation/history:
    get:
      x-required-roles: [ADMIN, AUDITOR]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Paginated persisted reconciliation runs }
  /api/v1/admin/reconciliation/runs/{runId}/findings:
    get:
      x-required-roles: [ADMIN, AUDITOR]
      parameters: [{ name: runId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Persisted findings for the selected run }
        '404': { description: Reconciliation run not found }
  /api/v1/admin/reconciliation/findings/{findingId}:
    get:
      x-required-roles: [ADMIN, AUDITOR]
      parameters: [{ name: findingId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Persisted finding detail }
        '404': { description: Finding not found }
    patch:
      x-required-roles: [ADMIN]
      parameters: [{ name: findingId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolutionNote]
              properties:
                status: { type: string, enum: [investigating, resolved] }
                resolutionNote: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200': { description: Finding investigation/resolution note recorded; financial ledgers are not corrected by this endpoint }
        '409': { description: A different Admin is required to resolve an investigated finding }
  /api/v1/admin/reconciliation/schedule:
    get:
      x-required-roles: [ADMIN, AUDITOR]
      responses:
        '200': { description: Current disabled-by-default UTC reconciliation schedule }
    put:
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, cadence]
              properties:
                enabled: { type: boolean }
                cadence: { type: string, enum: [daily, weekly] }
      responses:
        '200': { description: Persisted schedule configuration; requires the separate worker process }
        '403': { description: Admin role required }
  /api/v1/notifications:
    get:
      description: Lists user-created events and events for the user's owned accounts.
      responses:
        '200': { description: User-visible notifications }
  /api/v1/notifications/{eventId}/read:
    post:
      parameters: [{ name: eventId, in: path, required: true, schema: { type: string, format: uuid } }]
